name: 每日開獎資料更新
on:
  schedule:
    # 時間為 UTC（台北 = UTC+8）。伺服器本身在開獎時段每 1–2 分鐘自己查官方；
    # 這裡是備援：喚醒伺服器並觸發一次 /cron（需 CRON_TOKEN 密鑰）。GitHub 排程常延遲 5–15 分鐘。
    - cron: '45 12 * * 1-6'   # 台北 20:45 今彩539／大樂透／威力彩
    - cron: '0 13 * * 1-6'    # 台北 21:00
    - cron: '20 13 * * 1-6'   # 台北 21:20 補抓
    - cron: '40 13 * * *'     # 台北 21:40 香港六合彩
    - cron: '0 14 * * *'      # 台北 22:00 六合彩
    - cron: '20 14 * * *'     # 台北 22:20 六合彩補抓
    - cron: '40 1 * * *'      # 台北 09:40 加州天天樂（夏令）
    - cron: '0 2 * * *'       # 台北 10:00
    - cron: '40 2 * * *'      # 台北 10:40 加州天天樂（冬令）
    - cron: '0 3 * * *'       # 台北 11:00
    - cron: '10 11 * * 0,2-6' # 台北 19:10 越南 Vietlott
    - cron: '40 11 * * 0,2-6' # 台北 19:40 越南補抓
    - cron: '0 16 * * *'      # 台北 00:00 每日總檢查
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 喚醒並更新
        env:
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
        run: |
          for i in 1 2 3 4; do
            code=$(curl -s -o out.json -w "%{http_code}" --max-time 180 -H "X-Cron-Token: $CRON_TOKEN" https://calc-539.onrender.com/cron) && [ "$code" = 200 ] && cat out.json && exit 0
            echo "try $i -> $code"; sleep 30
          done
          exit 1
  links:
    # 每天台北 00:00 檢查網站所有對外連結與按鈕（有打不開的就讓這個工作失敗，GitHub 會通知）
    if: github.event.schedule == '0 16 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 檢查對外連結與按鈕
        run: node tests/links.check.js
