name: 每日開獎資料更新
on:
  schedule:
    # 時間為 UTC（台北 = UTC+8）
    - cron: '50 12 * * 1-6'   # 台北 20:50 今彩539／大樂透／威力彩
    - cron: '10 13 * * 1-6'   # 台北 21:10 補抓
    - cron: '45 13 * * *'     # 台北 21:45 香港六合彩
    - cron: '15 14 * * *'     # 台北 22:15 六合彩補抓
    - cron: '0 2 * * *'       # 台北 10:00 加州天天樂（夏令）
    - cron: '50 2 * * *'      # 台北 10:50 加州天天樂（冬令）
    - cron: '0 16 * * *'      # 台北 00:00 每日總檢查
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 喚醒並更新
        env:
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
        run: |
          for i in 1 2 3 4; do
            code=$(curl -s -o out.json -w "%{http_code}" --max-time 180 -H "X-Cron-Token: $CRON_TOKEN" https://calc-539.onrender.com/cron) && [ "$code" = 200 ] && cat out.json && exit 0
            echo "try $i -> $code"; sleep 30
          done
          exit 1
