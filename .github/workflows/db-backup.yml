name: DB backup (manual)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install PostgreSQL client 16
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-16
          psql --version
          pg_dump --version

      # External access is currently disabled (empty IP allow list).
      # Temporarily allow only this runner's IP, then restore in a later step.
      - name: Temporarily allow runner IP
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_POSTGRES_ID: dpg-dbbr768n74is739faqh0-a
        run: |
          set -euo pipefail
          set +x
          python3 - <<'PY'
          import ipaddress, json, os, sys, urllib.request

          def req(method, path, data=None):
              body = None if data is None else json.dumps(data).encode()
              r = urllib.request.Request(
                  "https://api.render.com" + path,
                  data=body, method=method,
                  headers={
                      "Authorization": f"Bearer {os.environ['RENDER_API_KEY']}",
                      "Accept": "application/json",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(r) as resp:
                      raw = resp.read()
                      return resp.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  print("HTTP", e.code, method, path, file=sys.stderr)
                  print((e.read().decode() or "")[:300], file=sys.stderr)
                  sys.exit(1)

          ip = urllib.request.urlopen("https://api.ipify.org").read().decode().strip()
          addr = ipaddress.ip_address(ip)
          cidr = f"{ip}/32" if addr.version == 4 else f"{ip}/128"
          print("allowing runner cidr", cidr)
          st, d = req("PATCH", f"/v1/postgres/{os.environ['RENDER_POSTGRES_ID']}", {
              "ipAllowList": [{"cidrBlock": cidr, "description": "gha-db-backup-temp"}]
          })
          print("patch_status", st, "db_status", d.get("status"), "ipAllowList", d.get("ipAllowList"))
          got = [x.get("cidrBlock") for x in (d.get("ipAllowList") or [])]
          if got != [cidr]:
              sys.exit("allow list did not match runner IP")
          PY

      - name: Dump database and table counts
        env:
          RENDER_DB_URL: ${{ secrets.RENDER_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          PGSSLMODE: require
          PGCONNECT_TIMEOUT: '30'
        run: |
          set -euo pipefail
          set +x
          if [ -z "${RENDER_DB_URL:-}" ] || [ -z "${BACKUP_PASSPHRASE:-}" ]; then
            echo "missing required secrets"
            exit 1
          fi
          python3 - <<'PY'
          import os, urllib.parse
          url = os.environ["RENDER_DB_URL"]
          print(f"::add-mask::{url}", flush=True)
          u = urllib.parse.urlparse(url)
          for val in (
              u.password,
              urllib.parse.unquote(u.password) if u.password else None,
              urllib.parse.quote(u.password, safe="") if u.password else None,
              u.username,
              u.hostname,
              os.environ.get("BACKUP_PASSPHRASE"),
          ):
              if val:
                  print(f"::add-mask::{val}", flush=True)
          PY

          mkdir -p out
          echo "starting pg_dump"
          ok=0
          for i in 1 2 3 4 5 6; do
            if pg_dump -Fc --no-owner --no-acl --dbname="$RENDER_DB_URL" -f out/calc539.dump; then
              ok=1
              break
            fi
            echo "pg_dump try $i failed, retrying"
            sleep 10
          done
          if [ "$ok" != 1 ]; then
            echo "pg_dump failed after retries"
            exit 1
          fi
          echo "pg_dump finished"
          ls -l out/calc539.dump

          echo "counting rows"
          python3 - <<'PY'
          import os, subprocess
          url = os.environ["RENDER_DB_URL"]
          env = os.environ.copy()

          def psql(sql):
              r = subprocess.run(
                  ["psql", "-X", "-v", "ON_ERROR_STOP=1", "--dbname", url, "-At", "-c", sql],
                  check=True, capture_output=True, text=True, env=env,
              )
              return r.stdout

          tables = [t for t in psql(
              "SELECT tablename FROM pg_tables WHERE schemaname='public' ORDER BY 1"
          ).splitlines() if t]
          print(f"public base tables: {len(tables)}", flush=True)
          lines = ["table\trow_count\n"]
          for t in tables:
              ident = '"' + t.replace('"', '""') + '"'
              n = psql(f"SELECT count(*) FROM public.{ident}").strip()
              lines.append(f"{t}\t{n}\n")
              print(f"counted {t}", flush=True)
          open("out/counts.tsv", "w").writelines(lines)
          PY

          echo "encrypting"
          gpg --symmetric --batch --yes --cipher-algo AES256 --passphrase "$BACKUP_PASSPHRASE" -o out/calc539.dump.gpg out/calc539.dump
          gpg --symmetric --batch --yes --cipher-algo AES256 --passphrase "$BACKUP_PASSPHRASE" -o out/counts.tsv.gpg out/counts.tsv
          rm -f out/calc539.dump out/counts.tsv
          ls -l out/
          echo "done"

      - name: Restore empty IP allow list
        if: always()
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_POSTGRES_ID: dpg-dbbr768n74is739faqh0-a
        run: |
          set -euo pipefail
          set +x
          python3 - <<'PY'
          import json, os, sys, urllib.request

          def req(method, path, data=None):
              body = None if data is None else json.dumps(data).encode()
              r = urllib.request.Request(
                  "https://api.render.com" + path,
                  data=body, method=method,
                  headers={
                      "Authorization": f"Bearer {os.environ['RENDER_API_KEY']}",
                      "Accept": "application/json",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(r) as resp:
                      raw = resp.read()
                      return resp.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  print("HTTP", e.code, method, path, file=sys.stderr)
                  print((e.read().decode() or "")[:300], file=sys.stderr)
                  sys.exit(1)

          st, d = req("PATCH", f"/v1/postgres/{os.environ['RENDER_POSTGRES_ID']}", {"ipAllowList": []})
          print("patch_status", st, "db_status", d.get("status"), "ipAllowList", d.get("ipAllowList"))
          if d.get("ipAllowList") not in ([], None):
              sys.exit("failed to clear allow list")
          print("allow list cleared")
          PY

      - name: Upload encrypted artifact
        uses: actions/upload-artifact@v4
        with:
          name: calc539-db-backup
          path: out/*.gpg
          retention-days: 1
          if-no-files-found: error
