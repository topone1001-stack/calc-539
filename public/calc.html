<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>539 碰數計算器</title><link rel="stylesheet" href="/style.css"><script src="/layout.js"></script><style>
body{display:block}.wrap{margin:0 auto}.card{max-width:none}table{width:100%;border-collapse:collapse;margin:8px 0 4px}td,th{border:1px solid #334155;padding:8px;text-align:center}th{background:#0f172a}
input.n{margin:0;padding:8px;text-align:center}h2{font-size:17px;margin:14px 0 6px}.tot{font-size:22px;color:#4ade80;font-weight:700}.note{font-size:12px;color:#94a3b8}.cols input{margin:4px 0}
.drawbox{border:1px solid #334155;border-radius:10px;padding:10px;margin:8px 0}.ball{display:inline-block;min-width:30px;padding:5px 0;margin:2px;border-radius:50%;background:#f59e0b;color:#111;font-weight:700;text-align:center}.ball.sp{background:#ef4444;color:#fff}.ball.hit{background:#22c55e;outline:3px solid #fff}.hist{font-size:13px;max-height:220px;overflow:auto}.hist td{padding:4px}details{margin-top:6px}.vw{position:relative;width:100%;padding-top:56.25%;margin-top:8px;background:#000;border-radius:8px;overflow:hidden}.vw iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.vbtn{display:inline-block;margin:6px 8px 0 0;color:#60a5fa}.prz td,.prz th{font-size:13px;padding:4px}</style></head><body><div class="wrap" style="flex-direction:column;align-items:stretch;max-width:760px">
<div class="card"><div class="top"><span id="who"></span><a href="/password" style="margin-left:auto;margin-right:8px">🔑 改密碼</a><form method="post" action="/logout"><button>登出</button></form></div>
<h1>539 碰數 / 獎金計算器</h1>
<h2>① 包牌（選號數 → 碰數）</h2><label>選幾個號碼<input class="n" id="pick" type="number" min="0" max="39" value="0"></label>
<table><tr><th></th><th>二星</th><th>三星</th><th>四星</th></tr>
<tr><td>價格</td><td><input class="n" id="p2" value="80"></td><td><input class="n" id="p3" value="70"></td><td><input class="n" id="p4" value="65"></td></tr>
<tr><td>碰數</td><td id="c2">0</td><td id="c3">0</td><td id="c4">0</td></tr>
<tr><td>支數</td><td><input class="n" id="s2" value="0"></td><td><input class="n" id="s3" value="0"></td><td><input class="n" id="s4" value="0"></td></tr>
<tr><td>小計</td><td id="t2">0</td><td id="t3">0</td><td id="t4">0</td></tr>
<tr><td>總計</td><td colspan="3" class="tot" id="tt">0</td></tr></table>
<h2>② 立柱（每柱幾個號碼）</h2><div class="cols" id="cols"></div><button class="btn" id="addc" style="padding:8px">＋ 新增一柱</button>
<p>立 <b id="nc">0</b> 柱：</p><table><tr><th></th><th>二星</th><th>三星</th><th>四星</th></tr><tr><td>碰數</td><td id="k2">0</td><td id="k3">0</td><td id="k4">0</td></tr></table>
<h2>③ 車（固定 1 號配全部其他號）</h2><table><tr><th></th><th>今彩539</th><th>大樂透</th><th>六合彩</th></tr>
<tr><td>車數</td><td><input class="n" id="v0" value="1"></td><td><input class="n" id="v1" value="1"></td><td><input class="n" id="v2" value="1"></td></tr>
<tr><td>本金</td><td id="b0"></td><td id="b1"></td><td id="b2"></td></tr><tr><td>中獎金額</td><td id="w0"></td><td id="w1"></td><td id="w2"></td></tr></table>
<p class="note">每碰 100 元；539 二星彩金 5,300、大樂透／六合彩 5,700（皆可依需要修改程式常數）。</p>
<h2>④ 獎金計算器</h2><table><tr><td>彩金</td><td><input class="n" id="g0" value="5300"></td></tr><tr><td>中幾碰</td><td><input class="n" id="g1" value="1"></td></tr><tr><td>支數</td><td><input class="n" id="g2" value="1"></td></tr><tr><td>金額</td><td class="tot" id="g3"></td></tr></table>
<h2>⑤ 開獎試算（包牌中幾顆）</h2><label>對照遊戲<select id="game" style="width:auto"><option value="539">今彩539</option><option value="lotto">大樂透</option><option value="super">威力彩</option><option value="ca">加州天天樂</option><option value="hk">香港六合彩</option></select></label><label>我的號碼（以空白或逗號分隔，對照最新一期自動算中幾顆）<input id="mine" placeholder="例：1 15 30 36 38"></label><p id="mres" class="note"></p><label>中幾顆（0–5）<input class="n" id="hit" type="number" min="0" max="5" value="2"></label>
<table><tr><th></th><th>二星</th><th>三星</th><th>四星</th></tr><tr><td>中獎碰數</td><td id="h2">0</td><td id="h3">0</td><td id="h4">0</td></tr><tr><td>彩金/支</td><td><input class="n" id="r2" value="5300"></td><td><input class="n" id="r3" value="57000"></td><td><input class="n" id="r4" value="750000"></td></tr><tr><td>獎金</td><td id="j2">0</td><td id="j3">0</td><td id="j4">0</td></tr><tr><td>淨利</td><td colspan="3" class="tot" id="net">0</td></tr></table>
</div></div><script src="/calc.js"></script></body></html>
