<body data-page="points"><div class="app">
<header class="top"><a class="back" href="/play">‹</a><div class="who"><b>我的點數</b><small class="label">娛樂用虛擬點數，無任何價值</small></div><a class="pts"><i class="coin"></i><span id="pts">—</span></a></header>
<section class="panel"><div class="big"><i class="coin lg"></i><span id="ptsBig">—</span><small>點</small></div><p class="note" id="spins"></p>
<form id="startF" class="startf"><label>自己輸入起始點數（<span id="rng"></span>）<input type="number" id="startN" required></label><button class="gbtn">開始遊玩</button><p class="note" id="startMsg"></p></form></section>
<section class="panel" id="rules"><h2>遊戲說明</h2><ul>
<li><b>娛樂用虛擬點數，無任何價值。</b>點數不能購買、不能儲值、不能兌換現金或獎品，也不能轉給別人。</li>
<li>起始點數由你自己輸入；點數用完（少於最低押注）才能重新輸入。</li>
<li>每一轉的結果由伺服器隨機決定，只看中間那一條線：三格相同、或左邊兩格相同就算中。</li>
<li>每個帳號每分鐘最多轉 30 次。</li></ul></section>
</div>
